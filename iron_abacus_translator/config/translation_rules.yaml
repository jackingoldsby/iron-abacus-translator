# Default Translation Rules Configuration
# This is the baseline configuration for content block translation

validation:
  quality:
    threshold: 9.5
    enabled: true

  footnote_markers:
    enabled: true
    fail_on_mismatch: true
    allowed_patterns:
      - '\[\d+\]'  # [1], [2], [3]...

  input:
    min_text_length: 5
    max_text_length: 10000

retry:
  max_attempts: 5
  backoff_strategy: "exponential"  # Options: exponential, linear, constant
  initial_delay: 1.0  # seconds
  max_delay: 30.0  # seconds
  exponential_base: 2.0

formatting:
  preserve_whitespace: true
  normalize_quotes: false
  trim_output: true

translation:
  model: "gpt-4.1-nano"
  temperature: 0.3
  timeout: 120  # seconds
  max_tokens: null  # null = no limit

logging:
  level: "INFO"
  include_metrics: true
  log_validation_details: true
  log_retry_attempts: true

glossary:
  enabled: false
  path: null  # Path to wuxia glossary database
