# Configuration for 三俠五義 (俞平伯校點本, 亞東圖書館 1925)
# 4 volumes, ~1615 pages, 120 回

book_id: 三俠五義

silver_gauge:
  # 1925 typography is clean — default params work well
  dpi: 150
  smooth_k: 15
  threshold_pct: 0.15
  # Typical body page has 10-13 columns
  expected_columns_min: 8
  expected_columns_max: 15

bronze_mirror:
  ocr_lang: "ch"
  min_confidence: 0.6
  running_header_max_chars: 20
  # Title + chapter header patterns specific to this book
  header_patterns:
    - "^三[侠俠煲伙][五][義羲义]"
    - "^第.{1,6}回"
    - "^[\\d一二三四五六七八九十百○]+$"
  # OCR shape confusions specific to this book's typography
  ocr_fixes:
    囘: 回
    煲: 俠      # 三煲五 → 三俠五
    羲: 義      # 五羲 → 五義
    "·": "，"   # Middle dot → comma

ivory_helm:
  max_iterations: 3
  min_kept_ratio: 0.5
  min_chars_per_page: 30
  max_empty_strips: 2

metadata:
  title: "三俠五義"
  creator: "石玉昆"
  language: "zh-Hant"
  source: "OCR from 1925 亞東圖書館 俞平伯校點本"
  publisher: "亞東圖書館"
