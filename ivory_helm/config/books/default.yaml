# Default configuration for all books.
# Book-specific YAML files override these values.

silver_gauge:
  dpi: 150
  margin_crop_pct: 0.02
  smooth_k: 15
  threshold_pct: 0.15
  min_column_width: 30
  max_column_width: 120
  strip_pad: 15
  header_ink_pct: 0.02
  expected_columns_min: 8
  expected_columns_max: 15

bronze_mirror:
  ocr_lang: "ch"
  min_confidence: 0.6
  running_header_max_chars: 20
  min_body_chars: 20
  header_patterns:
    - "^[\\d一二三四五六七八九十百○]+$"    # page numbers
  ocr_fixes:
    囘: 回
  normalize_punctuation: true
  s2t_conversion: true

platinum_scale:
  model: "gpt-4.1-nano"
  max_tokens: 120
  temperature: 0.0
  max_workers: 50

ivory_helm:
  max_iterations: 3
  min_kept_ratio: 0.5
  min_chars_per_page: 30
  max_empty_strips: 2
  reslice_strategies:
    - { smooth_k: 11, threshold_pct: 0.12 }
    - { smooth_k: 19, threshold_pct: 0.10 }
    - { smooth_k: 9,  threshold_pct: 0.20 }

metadata:
  language: "zh-Hant"
